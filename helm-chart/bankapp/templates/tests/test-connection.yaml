apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "bankapp.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
        - -qO-
        - "http://{{ include "bankapp.fullname" . }}-service:8080/actuator/health"
