apiVersion: v1
kind: Service
metadata:
  name: {{ include "bankapp.fullname" . }}-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bankapp.labels" . | nindent 4 }}

spec:
  type: ClusterIP

  sessionAffinity: ClientIP

  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600

  selector:
    app: bankapp

  ports:
    - port: 8080
      targetPort: 8080
